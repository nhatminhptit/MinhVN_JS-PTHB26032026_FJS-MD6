events { worker_connections 10240; }

http {
    # Nhóm upstream: Dễ dàng chuyển từ blue sang green bằng cách comment/uncomment
    upstream shopfast_backend {
        # Đang active cụm GREEN (v2)
        server app_green_1:3000 max_fails=3 fail_timeout=10s;
        server app_green_2:3000 max_fails=3 fail_timeout=10s;
        server app_green_3:3000 max_fails=3 fail_timeout=10s;
        server app_green_4:3000 max_fails=3 fail_timeout=10s;

        # Cụm BLUE (v1) để ở chế độ backup (tự động nhận tải nếu Green lỗi hoặc khi Rollback)
        # server app_blue_1:3000 backup;
        # server app_blue_2:3000 backup;
        # server app_blue_3:3000 backup;
        # server app_blue_4:3000 backup;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://shopfast_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Cấu hình giữ kết nối Realtime (WebSocket/SSE) không bị ngắt
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}