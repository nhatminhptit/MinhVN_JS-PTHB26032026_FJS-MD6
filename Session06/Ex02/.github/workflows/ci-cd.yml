name: CI/CD Pipeline

# Lắng nghe sự kiện push và pull request
on:
  push:
    branches: [main, master, "feature/**", develop]
  pull_request:
    branches: [main, master]

jobs:
  # =========================================================================
  # JOB 1: KIỂM THỬ TÍCH HỢP (CHẠY TRÊN MỌI NHÁNH VÀ MỌI PR)
  # =========================================================================
  test:
    runs-on: ubuntu-latest

    # Bẫy dữ liệu: Cung cấp sẵn PostgreSQL và Redis container thật cho integration test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shopfast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js 20 và bật Cache
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm" # (1) BẬT BỘ NHỚ ĐỆM CHO THƯ MỤC PHỤ THUỘC

      - name: Cài đặt phụ thuộc sạch sẽ
        run: npm ci

      - name: (2) Chạy kiểm thử tự động
        run: npm test

  # =========================================================================
  # JOB 2: ĐÓNG GÓI VÀ ĐẨY IMAGE (CHỈ CHẠY KHI TEST PASS VÀ Ở NHÁNH CHÍNH)
  # =========================================================================
  build-and-push:
    needs: test # (2) ĐIỀU KIỆN TIÊN QUYẾT: TEST PHẢI PASS MỚI ĐƯỢC CHẠY
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' # (4) CHỈ CHẠY Ở NHÁNH CHÍNH
    runs-on: ubuntu-latest

    # Cấp quyền cho GitHub Actions tự push image vào GHCR của repo
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Đăng nhập vào GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # (3) SỬ DỤNG SECRET CỦA NỀN TẢNG, KHÔNG LỘ MẬT KHẨU

      - name: Cài đặt Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đóng gói và đẩy Image lên kho lưu trữ
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest