name: Deploy ShopFast Backend to AWS ECR

on:
  push:
    branches: [main]

permissions:
  id-token: write # Bắt buộc để nhận JWT token từ GitHub OIDC
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      # Đảm nhận IAM Role tạm thời bằng giao thức Web Identity (OIDC)
      - name: Configure AWS Credentials with IAM Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/ShopFast-GithubActions-Role
          aws-region: ap-southeast-1

      - name: Đăng nhập vào Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Đóng gói và đẩy Image lên Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: shopfast/backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG