name: S06 - Ex02 CI/CD Pipeline

on:
  push:
    branches: [main, master, "feature/**", develop]
    paths:
      - "Session06/Ex02/**"
      - ".github/workflows/s06-ex02.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "Session06/Ex02/**"

jobs:
  # =========================================================================
  # JOB 1: KIỂM THỬ TÍCH HỢP CHO EX02
  # =========================================================================
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shopfast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: Session06/Ex02

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js 20 và bật Cache
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Session06/Ex02/package-lock.json

      - name: Cài đặt phụ thuộc sạch sẽ
        run: npm ci

      - name: Chạy kiểm thử tự động
        run: npm test

  # =========================================================================
  # JOB 2: ĐÓNG GÓI VÀ ĐẨY IMAGE (CHỈ NHÁNH CHÍNH & KHI TEST PASS)
  # =========================================================================
  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Đăng nhập vào GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cài đặt Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đóng gói và đẩy Image lên kho lưu trữ
        uses: docker/build-push-action@v5
        with:
          context: Session06/Ex02
          file: Session06/Ex02/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ex02:${{ github.sha }}
            ghcr.io/${{ github.repository }}/ex02:latest
